openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Controlled Verify V1 product configuration
  - name: account
    description: Customer account and dashboard operations
  - name: transactions
    description: Guest and authenticated transaction operations
  - name: admin
    description: Protected administration operations
  - name: contact
    description: Public support contact and protected message review
  - name: webhooks
    description: Provider and authentication webhook structure
  - name: credas
    description: Server-side Credas identity, bank account, property and Right to Rent checks
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List configured Verify products
      responses:
        "200":
          description: Configured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/{slug}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get one configured Verify product
      parameters:
        - $ref: "#/components/parameters/ProductSlug"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me:
    get:
      operationId: getCurrentUser
      tags: [account]
      summary: Get the current authenticated user
      security:
        - clerkSession: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [account]
      summary: Get the current customer dashboard summary
      security:
        - clerkSession: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions for the current customer
      security:
        - clerkSession: []
      responses:
        "200":
          description: Customer transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a guest or authenticated transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Invalid transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transactions/{reference}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction by DepositSafe reference
      parameters:
        - $ref: "#/components/parameters/TransactionReference"
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /companies-house/search:
    get:
      operationId: searchCompaniesHouseCompanies
      tags: [companies-house]
      summary: Search Companies House companies
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
      responses:
        "200":
          description: Matching public company records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySearchResponse"
        "503":
          description: Companies House is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transactions/{reference}/companies-house/check:
    post:
      operationId: runCompaniesHouseCheck
      tags: [companies-house]
      summary: Check a selected Companies House company for a transaction
      security:
        - clerkSession: []
        - guestCapability: []
      parameters:
        - $ref: "#/components/parameters/TransactionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyCheckInput"
      responses:
        "200":
          description: Stored Companies House result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyCheckResult"
        "403":
          description: Valid transaction access is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transactions/{reference}/companies-house/result:
    get:
      operationId: getCompaniesHouseResult
      tags: [companies-house]
      summary: Get the Companies House result linked to a transaction
      security:
        - clerkSession: []
        - guestCapability: []
      parameters:
        - $ref: "#/components/parameters/TransactionReference"
      responses:
        "200":
          description: Companies House result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyCheckResult"
        "404":
          description: No Companies House result exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transactions/{reference}/credas:
    get:
      operationId: getCredasChecks
      tags: [credas]
      summary: Get the Credas checks linked to a transaction
      security:
        - clerkSession: []
        - guestCapability: []
      parameters:
        - $ref: "#/components/parameters/TransactionReference"
      responses:
        "200":
          description: Credas check state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredasCheckState"
        "403":
          description: Valid transaction access is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transactions/{reference}/credas/start:
    post:
      operationId: startCredasVerification
      tags: [credas]
      summary: Invite the people being verified to their Credas journey
      description: Requires a confirmed payment. Creates one Credas process per person and sends each their invitation.
      security:
        - clerkSession: []
        - guestCapability: []
      parameters:
        - $ref: "#/components/parameters/TransactionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredasStartInput"
      responses:
        "200":
          description: Credas check state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredasCheckState"
        "402":
          description: A confirmed payment is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transactions/{reference}/credas/bank-account:
    post:
      operationId: runCredasBankAccountCheck
      tags: [credas]
      summary: Run the bank account check for a transaction
      description: Requires a confirmed payment. Account details are sent to Credas server-side and are not stored in full.
      security:
        - clerkSession: []
        - guestCapability: []
      parameters:
        - $ref: "#/components/parameters/TransactionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredasBankAccountInput"
      responses:
        "200":
          description: Credas check state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredasCheckState"
        "402":
          description: A confirmed payment is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transactions/{reference}/credas/property:
    post:
      operationId: runCredasPropertyCheck
      tags: [credas]
      summary: Run the property ownership check for a transaction
      security:
        - clerkSession: []
        - guestCapability: []
      parameters:
        - $ref: "#/components/parameters/TransactionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredasPropertyInput"
      responses:
        "200":
          description: Credas check state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredasCheckState"
        "402":
          description: A confirmed payment is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transactions/{reference}/credas/property/title:
    post:
      operationId: selectCredasPropertyTitle
      tags: [credas]
      summary: Choose which registered title to retrieve when an address matches several
      security:
        - clerkSession: []
        - guestCapability: []
      parameters:
        - $ref: "#/components/parameters/TransactionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredasTitleSelectionInput"
      responses:
        "200":
          description: Credas check state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredasCheckState"
        "409":
          description: No title selection is pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transactions/{reference}/credas/refresh:
    post:
      operationId: refreshCredasChecks
      tags: [credas]
      summary: Re-read open Credas checks from the provider
      security:
        - clerkSession: []
        - guestCapability: []
      parameters:
        - $ref: "#/components/parameters/TransactionReference"
      responses:
        "200":
          description: Credas check state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredasCheckState"
        "402":
          description: A confirmed payment is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transactions/{reference}/credas/checks/{checkId}/resend-invite:
    post:
      operationId: resendCredasInvite
      tags: [credas]
      summary: Send the invited person their Credas invitation again
      security:
        - clerkSession: []
        - guestCapability: []
      parameters:
        - $ref: "#/components/parameters/TransactionReference"
        - $ref: "#/components/parameters/CredasCheckId"
      responses:
        "200":
          description: Credas check state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredasCheckState"
        "429":
          description: An invitation was sent too recently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transactions/{reference}/credas/checks/{checkId}/journey-link:
    post:
      operationId: createCredasJourneyLink
      tags: [credas]
      summary: Create a short-lived link for completing your own verification
      description: Issued only when the person being verified is the transaction owner. The link signs that person in to their journey.
      security:
        - clerkSession: []
        - guestCapability: []
      parameters:
        - $ref: "#/components/parameters/TransactionReference"
        - $ref: "#/components/parameters/CredasCheckId"
      responses:
        "200":
          description: Journey link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredasJourneyLink"
        "403":
          description: The verification belongs to another person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transactions/{reference}/credas/checks/{checkId}/documents/{documentId}:
    get:
      operationId: downloadCredasDocument
      tags: [credas]
      summary: Download a PDF document for a completed Credas check
      security:
        - clerkSession: []
        - guestCapability: []
      parameters:
        - $ref: "#/components/parameters/TransactionReference"
        - $ref: "#/components/parameters/CredasCheckId"
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            pattern: "^(report|settled-status|file-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$"
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: The document is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/credas/journeys:
    get:
      operationId: listCredasJourneys
      tags: [admin]
      summary: List the Credas journeys and actors available to the configured API key
      security:
        - clerkSession: []
      responses:
        "200":
          description: Credas journeys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CredasJourney"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/credas/checks/{checkId}/actions:
    post:
      operationId: runCredasAdminAction
      tags: [admin]
      summary: Run a staff action against a Credas check
      description: Invite management, Right to Rent remediation and data erasure. Requires an explicit administrator role; every action is audited.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/CredasCheckId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredasAdminActionInput"
      responses:
        "200":
          description: Credas check state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredasCheckState"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /webhooks/credas:
    post:
      operationId: receiveCredasWebhook
      tags: [webhooks]
      summary: Receive a Credas process-complete notification
      description: Credas webhooks are unsigned. The secret token identifies the check, and the status and result are then read back from Credas server-side; the body is never trusted.
      parameters:
        - name: t
          in: query
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 43
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredasWebhookEvent"
      responses:
        "200":
          description: Notification accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAccepted"
        "401":
          description: Unknown or mismatched notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transactions/{reference}/payments/checkout:
    post:
      operationId: createStripeCheckoutSession
      tags: [payments]
      summary: Create a Stripe Checkout session for an existing transaction
      security:
        - clerkSession: []
        - guestCapability: []
      parameters:
        - $ref: "#/components/parameters/TransactionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeCheckoutInput"
      responses:
        "201":
          description: Stripe Checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeCheckoutResponse"
        "409":
          description: Transaction is not eligible for checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/providers/stripe/catalog-sync:
    post:
      operationId: syncStripeCatalog
      tags: [admin]
      summary: Map existing Stripe products/prices to the DepositSafe catalogue
      description: Maps the runtime environment's existing Stripe prices to locked DepositSafe products without creating or changing live Stripe objects.
      security:
        - clerkSession: []
      responses:
        "200":
          description: Stripe catalogue synchronization summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeCatalogSyncResponse"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/transactions:
    get:
      operationId: listAdminTransactions
      tags: [admin]
      summary: List all transactions for authorised administrators
      security:
        - clerkSession: []
      responses:
        "200":
          description: All transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/contact-messages:
    get:
      operationId: listAdminContactMessages
      tags: [admin]
      summary: List recent public contact form submissions
      security:
        - clerkSession: []
      responses:
        "200":
          description: Recent contact messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactMessage"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contact-messages:
    post:
      operationId: submitContactMessage
      tags: [contact]
      summary: Submit a public support enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageInput"
      responses:
        "201":
          description: Enquiry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmissionResponse"
        "400":
          description: Invalid enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Enquiry storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many enquiries in a short period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /webhooks/clerk:
    post:
      operationId: receiveClerkWebhook
      tags: [webhooks]
      summary: Reserved Clerk webhook endpoint
      description: Build 01 reserves this endpoint for future user synchronization. It does not call external providers.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookInput"
      responses:
        "202":
          description: Accepted for future processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAccepted"
  /webhooks/stripe:
    post:
      operationId: receiveStripeWebhook
      tags: [webhooks]
      summary: Receive a signed Stripe event
      description: Stripe-Signature is verified against the raw request bytes using the managed webhook signing secret before the event is processed.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeWebhookEvent"
      responses:
        "200":
          description: Event accepted or already processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWebhookResponse"
        "400":
          description: Invalid signature or payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Webhook signing secret is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      description: Clerk session cookie is used by the browser; bearer notation documents the protected contract.
    guestCapability:
      type: apiKey
      in: header
      name: X-Guest-Capability
      description: One-time issued random capability for a guest transaction; stored only as a hash server-side.
  parameters:
    ProductSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    TransactionReference:
      name: reference
      in: path
      required: true
      schema:
        type: string
    CredasCheckId:
      name: checkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Product:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        pricePence:
          type: integer
        price:
          type: string
        provider:
          type: string
        participantMode:
          type: string
          enum: [single, multiple]
        active:
          type: boolean
      required: [slug, name, pricePence, price, provider, participantMode, active]
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [customer, admin]
      required: [id, email, displayName, role]
    ParticipantInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
      required: [name, email]
    Participant:
      allOf:
        - $ref: "#/components/schemas/ParticipantInput"
        - type: object
          properties:
            id:
              type: string
          required: [id]
    TransactionInput:
      type: object
      properties:
        productSlug:
          type: string
        email:
          type: string
        participant:
          $ref: "#/components/schemas/ParticipantInput"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ParticipantInput"
      required: [productSlug, email]
    Transaction:
      type: object
      properties:
        reference:
          type: string
        product:
          $ref: "#/components/schemas/Product"
        email:
          type: string
        status:
          $ref: "#/components/schemas/TransactionStatus"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isGuest:
          type: boolean
        guestCapability:
          type: string
          nullable: true
      required: [reference, product, email, status, participants, createdAt, updatedAt, isGuest]
    CompanySearchResponse:
      type: object
      properties:
        totalResults:
          type: integer
        truncated:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/CompanySearchResult"
      required: [items]
    CompanySearchResult:
      type: object
      properties:
        companyNumber:
          type: string
        name:
          type: string
        status:
          type: string
        dateOfCreation:
          type: string
          nullable: true
        addressSnippet:
          type: string
          nullable: true
      required: [companyNumber, name, status]
    CompanyCheckInput:
      type: object
      properties:
        companyNumber:
          type: string
          minLength: 1
          maxLength: 8
      required: [companyNumber]
    CompanyCheckResult:
      type: object
      properties:
        verificationId:
          type: string
        transactionReference:
          type: string
        companyNumber:
          type: string
        companyName:
          type: string
        companyStatus:
          type: string
        companyType:
          type: string
        dateOfCreation:
          type: string
          nullable: true
        dateOfCessation:
          type: string
          nullable: true
        registeredOfficeAddress:
          type: string
          nullable: true
        sicCodes:
          type: array
          items:
            type: string
        nextAccountsDue:
          type: string
          nullable: true
        nextConfirmationStatementDue:
          type: string
          nullable: true
        sourceUrl:
          type: string
        outcome:
          type: string
        transactionStatus:
          $ref: "#/components/schemas/TransactionStatus"
        checkedAt:
          type: string
          format: date-time
      required: [verificationId, transactionReference, companyNumber, companyName, companyStatus, outcome, transactionStatus, checkedAt]
    CredasParticipantInput:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        surname:
          type: string
          minLength: 1
